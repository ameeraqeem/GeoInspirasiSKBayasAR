<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F2A26">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Langkawi Geopark — Banner Hidup AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#000;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    user-select:none; -webkit-user-select:none;
  }

  /* ===== KAMERA FULLSCREEN ===== */
  a-scene{
    position:fixed !important; top:0 !important; left:0 !important;
    width:100vw !important; height:100vh !important; z-index:1;
  }
  a-scene video{
    position:fixed !important; top:50% !important; left:50% !important;
    transform:translate(-50%,-50%) !important;
    min-width:100% !important; min-height:100% !important;
    width:auto !important; height:auto !important;
    object-fit:cover !important; z-index:0 !important;
  }
  canvas.a-canvas{
    position:fixed !important; top:0 !important; left:0 !important;
    width:100vw !important; height:100vh !important; z-index:2 !important;
  }

  /* ===== SKRIN MULA ===== */
  #skrin-mula{
    position:fixed; inset:0; z-index:100;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(27,138,143,.35), transparent 60%),
      linear-gradient(165deg,#0F2A26,#12332E 60%,#0a1f1c);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#F4EEDF; text-align:center; padding:28px;
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #skrin-mula .eyebrow{
    font-size:10.5px; letter-spacing:3px; color:#8FD6C4;
    text-transform:uppercase; margin-bottom:12px; font-weight:700;
  }
  #skrin-mula h1{font-size:25px; margin:0 0 12px; font-family:Georgia,'Times New Roman',serif; line-height:1.25;}
  #skrin-mula p{font-size:14px; color:#A8CFC6; max-width:320px; margin:0 0 30px; line-height:1.6;}
  #btn-mula{
    background:linear-gradient(135deg,#FF9C55,#F97316); color:white; border:none;
    padding:17px 42px; border-radius:32px; font-size:16px; font-weight:700;
    box-shadow:0 10px 30px rgba(249,115,22,.45); cursor:pointer;
    transition:transform .15s ease;
  }
  #btn-mula:active{transform:scale(.96);}
  #skrin-mula .langkah{
    margin-top:28px; display:flex; gap:18px; font-size:10.5px; color:#5E8B82;
  }
  #skrin-mula .langkah div{max-width:80px; line-height:1.5;}
  #skrin-mula .langkah b{display:block; font-size:17px; color:#8FD6C4; margin-bottom:3px;}

  /* ===== STATUS ===== */
  #status{
    position:fixed; top:0; left:0; right:0; z-index:30;
    background:rgba(15,42,38,.94); backdrop-filter:blur(10px);
    color:#F4EEDF; padding:11px 16px; font-size:12.5px; text-align:center;
    padding-top:calc(11px + env(safe-area-inset-top));
    transition:background .3s ease; font-weight:500;
  }
  #status.ok{background:rgba(21,128,110,.94);}
  #status.err{background:rgba(185,60,25,.95);}
  #status .dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:#8FD6C4; margin-right:7px; vertical-align:middle;
    animation:blink 1.6s infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  #status.ok .dot{background:#B9F5C0; animation:none;}

  /* ===== BAR BAWAH ===== */
  #bar-bawah{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    display:none; gap:9px; justify-content:center;
    padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,.45), transparent);
  }
  #bar-bawah button{
    background:rgba(244,238,223,.96); color:#12332E; border:none;
    padding:12px 20px; border-radius:24px; font-size:13px; font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.25); transition:transform .12s ease;
  }
  #bar-bawah button:active{transform:scale(.95);}
  #bar-bawah button.aktif{background:#FF8A3D; color:#fff;}

  /* ===== SENARAI PINTASAN ===== */
  #senarai{
    position:fixed; left:0; right:0; bottom:70px; z-index:29;
    display:none; gap:7px; overflow-x:auto; padding:10px 12px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  #senarai::-webkit-scrollbar{display:none;}
  #senarai.show{display:flex; animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  #senarai button{
    flex:0 0 auto; background:rgba(15,42,38,.9); backdrop-filter:blur(8px);
    color:#F4EEDF; border:1px solid rgba(255,255,255,.22); border-radius:18px;
    padding:9px 14px; font-size:11.5px; white-space:nowrap; font-weight:600;
  }
  #senarai button .n{
    display:inline-block; width:16px; height:16px; line-height:16px;
    border-radius:50%; background:#FF8A3D; color:#fff;
    font-size:9.5px; text-align:center; margin-right:6px;
  }

  /* ===== POPUP INFO ===== */
  #overlay-popup{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:22px;
    background:rgba(0,0,0,.5); backdrop-filter:blur(3px);
  }
  #overlay-popup.show{display:flex; animation:fadeIn .2s ease;}
  .popup-card{
    width:100%; max-width:315px; padding:24px 22px 20px; position:relative;
    background:rgba(18,45,42,0.72);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid rgba(255,255,255,.28); border-radius:24px;
    box-shadow:0 16px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25);
    text-align:center; color:#F4EEDF;
    animation:popIn .3s cubic-bezier(.2,1.2,.35,1);
  }
  @keyframes popIn{from{transform:scale(.85) translateY(14px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .popup-card .badge-num{
    position:absolute; top:-13px; left:50%; transform:translateX(-50%);
    background:#FF8A3D; color:#fff; width:28px; height:28px; line-height:28px;
    border-radius:50%; font-size:13px; font-weight:700;
    border:2.5px solid rgba(18,45,42,.9);
  }
  .popup-card .icon{font-size:46px; line-height:1; margin-top:6px;}
  .popup-card h3{margin:10px 0 8px; font-size:18px; letter-spacing:.6px;}
  .popup-card p{margin:0; font-size:14px; line-height:1.6; color:#DFF3EC;}
  .popup-card .progres{
    height:3px; background:rgba(255,255,255,.15); border-radius:3px;
    margin-top:16px; overflow:hidden;
  }
  .popup-card .progres i{display:block; height:100%; width:0%; background:#8FD6C4; transition:width .15s linear;}
  .popup-card .row{display:flex; gap:9px; margin-top:14px;}
  .popup-card button{
    flex:1; padding:12px; border-radius:16px; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.14); color:#fff; font-size:13px; font-weight:600;
    transition:transform .12s ease;
  }
  .popup-card button:active{transform:scale(.96);}
  .popup-card .tutup{background:rgba(255,138,61,.92); border-color:transparent;}
  .popup-card .nav{display:flex; justify-content:space-between; margin-top:12px; font-size:11.5px; color:#8FD6C4;}
  .popup-card .nav span{padding:6px 10px; border-radius:12px; background:rgba(255,255,255,.08);}
</style>
</head>
<body>

<!-- ============ SKRIN MULA ============ -->
<div id="skrin-mula">
  <div class="eyebrow">Langkawi UNESCO Global Geopark</div>
  <h1>Banner Hidup<br>Augmented Reality</h1>
  <p>Halakan kamera ke banner untuk hidupkan pemandangan, kemudian sentuh bulatan bernombor untuk baca &amp; dengar nota.</p>
  <button id="btn-mula">Mula Pengalaman AR</button>
  <div class="langkah">
    <div><b>1</b>Benarkan kamera</div>
    <div><b>2</b>Hala ke banner</div>
    <div><b>3</b>Sentuh nombor</div>
  </div>
</div>

<div id="status" style="display:none;"><span class="dot"></span><span id="status-teks">Memulakan…</span></div>

<div id="senarai"></div>

<div id="bar-bawah">
  <button id="btn-senarai">Senarai Info</button>
  <button id="btn-reload">Mula Semula</button>
</div>

<!-- ============ POPUP ============ -->
<div id="overlay-popup">
  <div class="popup-card" id="popup-card">
    <div class="badge-num" id="pop-num">1</div>
    <div class="icon" id="pop-icon">🦅</div>
    <h3 id="pop-title">TAJUK</h3>
    <p id="pop-fact">Nota...</p>
    <div class="progres"><i id="pop-progres"></i></div>
    <div class="row">
      <button id="pop-dengar">Dengar Semula</button>
      <button class="tutup" id="pop-tutup">Tutup</button>
    </div>
    <div class="nav">
      <span id="pop-prev">‹ Sebelum</span>
      <span id="pop-next">Seterusnya ›</span>
    </div>
  </div>
</div>

<!-- ============ SCENE AR ============ -->
<a-scene id="ar-scene"
         mindar-image="imageTargetSrc: ./assets/targets.mind; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 10; warmupTolerance: 1;"
         color-space="sRGB" renderer="colorManagement: true, alpha: true, antialias: true"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
         embedded style="display:none;">

  <a-assets timeout="20000">
    <video id="video-geopark" src="./assets/geopark-video.mp4" preload="auto"
           loop playsinline webkit-playsinline crossorigin="anonymous"></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: .clickable; far: 30"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
    <a-video src="#video-geopark" width="1" height="0.41653" position="0 0 0"></a-video>
    <!-- pin dijana oleh JS supaya konsisten & mudah diselenggara -->
    <a-entity id="pin-holder"></a-entity>
  </a-entity>
</a-scene>

<script>
// =========================================================
// DATA — satu sumber kebenaran untuk pin, popup, senarai
// x%,y% ialah kedudukan pada gambar (0-100)
// =========================================================
const DATA = [
  {id:"helang",      n:1,  icon:"🦅", title:"HELANG",            x:33.5, y:14.5, warna:"#FF8A3D",
   fact:"Nama 'Langkawi' berasal daripada 'Lang' (helang) dan 'Kawi' — sejenis batu merah di pulau ini.",
   audio:"assets/audio/01-helang.wav"},
  {id:"cablecar",    n:2,  icon:"🚡", title:"CABLE CAR",         x:14.5, y:10,   warna:"#FF8A3D",
   fact:"Naik 700 meter ke puncak Gunung Mat Cincang, formasi geologi tertua di Asia Tenggara.",
   audio:"assets/audio/02-cablecar.wav"},
  {id:"telagatujuh", n:3,  icon:"💧", title:"TELAGA TUJUH",      x:7.5,  y:30,   warna:"#FF8A3D",
   fact:"Tujuh kolam semula jadi dari air terjun setinggi 91 meter. Legenda: didiami bidadari.",
   audio:"assets/audio/03-telagatujuh.wav"},
  {id:"kilim",       n:4,  icon:"🏞️", title:"KILIM GEOPARK",     x:93.5, y:42,   warna:"#FF8A3D",
   fact:"Seluas 100 km persegi — satu-satunya di Malaysia yang gabungkan karst tepi laut dan hutan bakau.",
   audio:"assets/audio/04-kilim.wav"},
  {id:"pulau99",     n:5,  icon:"🏝️", title:"99 PULAU",          x:50,   y:42,   warna:"#FF8A3D",
   fact:"Langkawi ialah kepulauan 99 buah pulau semasa air pasang.",
   audio:"assets/audio/05-pulau99.wav"},
  {id:"tanjungrhu",  n:6,  icon:"🏖️", title:"TANJUNG RHU",       x:10,   y:90.5, warna:"#FF8A3D",
   fact:"Pantai berpasir putih di utara Langkawi, titik permulaan lawatan bot ke Kilim.",
   audio:"assets/audio/06-tanjungrhu.wav"},
  {id:"botmangrove", n:7,  icon:"🚤", title:"BOT MANGROVE",      x:56.5, y:68.5, warna:"#FF8A3D",
   fact:"Jelajah seluruh Langkawi naik mangrove boat — sungai, gua dan kawasan helang!",
   audio:"assets/audio/07-botmangrove.wav"},
  {id:"machinchang", n:8,  icon:"🏔️", title:"MACHINCHANG",       x:19,   y:16,   warna:"#1B8A8F",
   fact:"Banjaran gunung tertua di Malaysia — lebih 500 juta tahun.",
   audio:"assets/audio/08-machinchang.wav"},
  {id:"hutanbakau",  n:9,  icon:"🌿", title:"HUTAN BAKAU KILIM", x:90,   y:72,   warna:"#1B8A8F",
   fact:"Habitat helang, sikas batu kapur dan pelbagai hidupan laut unik.",
   audio:"assets/audio/09-hutanbakau.wav"},
  {id:"visigeopark", n:10, icon:"🛡️", title:"VISI GEOPARK",      x:14,   y:68,   warna:"#1B8A8F",
   fact:"UNESCO Geopark — pemuliharaan alam dan pelancongan mampan untuk generasi akan datang.",
   audio:"assets/audio/10-visigeopark.wav"},
];

const H = 0.41653;                     // tinggi target dalam unit MindAR
const toUnit = d => ({
  x: (d.x/100) - 0.5,
  y: (0.5 - d.y/100) * H
});

// =========================================================
// Jana pin 3D secara dinamik
// =========================================================
const holder = document.getElementById('pin-holder');
DATA.forEach(d => {
  const p = toUnit(d);
  const e = document.createElement('a-entity');
  e.setAttribute('class','pin clickable');
  e.setAttribute('data-id', d.id);
  e.setAttribute('position', `${p.x.toFixed(5)} ${p.y.toFixed(5)} 0.03`);
  e.innerHTML = `
    <a-circle radius="0.034" color="#FFFFFF" opacity="0.5" position="0 0 -0.003"
      animation="property: scale; from: 1 1 1; to: 1.35 1.35 1; dir: alternate; dur: 1400; loop: true; easing: easeInOutSine"></a-circle>
    <a-circle radius="0.023" color="${d.warna}" opacity="1"></a-circle>
    <a-circle radius="0.023" color="#FFFFFF" opacity="0.9" position="0 0 -0.001" scale="1.18 1.18 1"></a-circle>
    <a-text value="${d.n}" align="center" color="#FFFFFF" width="1.15"
      position="0 0 0.002" scale="${d.n===10?0.44:0.52} ${d.n===10?0.44:0.52} 1"></a-text>
  `;
  holder.appendChild(e);
});

// =========================================================
// Audio — satu instance, dengan ducking audio video
// =========================================================
const videoEl = document.getElementById('video-geopark');
let currentAudio = null;
let progresTimer = null;
let indeksSemasa = -1;

function hentikanAudio(){
  if(currentAudio){ currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
  if(progresTimer){ clearInterval(progresTimer); progresTimer = null; }
  document.getElementById('pop-progres').style.width = '0%';
  // pulihkan volum video (BUG 2 dibetulkan)
  try{ videoEl.volume = 1.0; }catch(e){}
}

function mainAudio(d){
  hentikanAudio();
  // duck audio video supaya narasi jelas (BUG 2)
  try{ videoEl.volume = 0.12; }catch(e){}

  const a = new Audio(d.audio);
  currentAudio = a;
  const bar = document.getElementById('pop-progres');

  a.play().catch(() => {
    // fallback TTS jika fail audio gagal (BUG 6)
    try{ videoEl.volume = 1.0; }catch(e){}
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(d.title + '. ' + d.fact);
      u.lang = 'ms-MY'; u.rate = .95;
      const vs = speechSynthesis.getVoices();
      const v = vs.find(v=>v.lang?.toLowerCase().startsWith('ms')) || vs.find(v=>v.lang?.toLowerCase().startsWith('id'));
      if(v) u.voice = v;
      speechSynthesis.speak(u);
    }
  });

  a.addEventListener('ended', () => { try{ videoEl.volume = 1.0; }catch(e){} });
  progresTimer = setInterval(() => {
    if(a.duration) bar.style.width = ((a.currentTime/a.duration)*100).toFixed(1) + '%';
  }, 120);
}

// =========================================================
// Popup
// =========================================================
const overlay = document.getElementById('overlay-popup');
function bukaPopup(idx){
  if(idx < 0 || idx >= DATA.length) return;
  indeksSemasa = idx;
  const d = DATA[idx];
  document.getElementById('pop-num').textContent = d.n;
  document.getElementById('pop-icon').textContent = d.icon;
  document.getElementById('pop-title').textContent = d.title;
  document.getElementById('pop-fact').textContent = d.fact;
  overlay.classList.add('show');
  document.getElementById('senarai').classList.remove('show');   // BUG 7
  document.getElementById('btn-senarai').classList.remove('aktif');
  mainAudio(d);
}
function tutupPopup(){
  overlay.classList.remove('show');
  hentikanAudio();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  indeksSemasa = -1;
}
document.getElementById('pop-tutup').onclick = tutupPopup;
document.getElementById('pop-dengar').onclick = () => { if(indeksSemasa>=0) mainAudio(DATA[indeksSemasa]); };
document.getElementById('pop-prev').onclick = () => bukaPopup((indeksSemasa-1+DATA.length)%DATA.length);
document.getElementById('pop-next').onclick = () => bukaPopup((indeksSemasa+1)%DATA.length);
// tekan luar kad untuk tutup (BUG 9)
overlay.addEventListener('click', e => { if(e.target === overlay) tutupPopup(); });

// pin klik
document.querySelectorAll('.pin').forEach(pin => {
  pin.addEventListener('click', () => {
    const i = DATA.findIndex(d => d.id === pin.dataset.id);
    bukaPopup(i);
  });
});

// senarai pintasan
const senarai = document.getElementById('senarai');
DATA.forEach((d,i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="n">${d.n}</span>${d.title}`;
  b.onclick = () => bukaPopup(i);
  senarai.appendChild(b);
});
document.getElementById('btn-senarai').onclick = function(){
  senarai.classList.toggle('show');
  this.classList.toggle('aktif', senarai.classList.contains('show'));
};
document.getElementById('btn-reload').onclick = () => location.reload();

// =========================================================
// Status
// =========================================================
function setStatus(msg, cls){
  document.getElementById('status-teks').textContent = msg;
  document.getElementById('status').className = cls || '';
}

// jeda audio bila tukar app / kunci skrin (BUG 10)
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    if(currentAudio) currentAudio.pause();
    videoEl.pause();
    if('speechSynthesis' in window) speechSynthesis.cancel();
  } else {
    videoEl.play().catch(()=>{});
  }
});

// =========================================================
// MULA
// =========================================================
document.getElementById('btn-mula').addEventListener('click', async () => {
  document.getElementById('skrin-mula').style.display = 'none';
  document.getElementById('status').style.display = 'block';
  document.getElementById('bar-bawah').style.display = 'flex';
  setStatus('Memuatkan sistem AR…');

  const scene = document.getElementById('ar-scene');
  scene.style.display = 'block';

  // audio video dibenarkan sebab ini dalam gesture pengguna (BUG 1)
  videoEl.muted = false;
  videoEl.volume = 1.0;
  videoEl.play().catch(() => { videoEl.muted = true; videoEl.play().catch(()=>{}); });

  // maklum balas pemuatan video (BUG 4)
  videoEl.addEventListener('canplaythrough', () => console.log('Video sedia'));
  videoEl.addEventListener('error', () => setStatus('RALAT: video gagal dimuat', 'err'));

  // semak marker wujud
  try{
    const r = await fetch('./assets/targets.mind', {method:'HEAD'});
    if(!r.ok) throw new Error();
    setStatus('Halakan kamera ke banner Langkawi Geopark');
  }catch(e){
    setStatus('RALAT: targets.mind tiada dalam folder assets/', 'err');
  }

  const target = document.getElementById('target-entity');
  target.addEventListener('targetFound', () => {
    setStatus('Banner dikesan — sentuh bulatan bernombor', 'ok');
    videoEl.play().catch(()=>{});
  });
  target.addEventListener('targetLost', () => {
    setStatus('Halakan kamera ke banner Langkawi Geopark');
    tutupPopup();   // BUG 3
  });

  scene.addEventListener('arError', () => setStatus('RALAT AR: gagal mulakan kamera', 'err'));
});
</script>
</body>
</html>
